name: Cross-platform verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Check committed artifact reproducibility
        run: git diff --exit-code -- dist
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Exercise Linux native credential storage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c 'printf "%s" "isolated-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; node scripts/native-smoke.mjs && node scripts/bundle-smoke.mjs'
      - name: Exercise native credential storage
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs && node scripts/bundle-smoke.mjs
