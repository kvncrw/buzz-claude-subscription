name: Cross-platform verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Check committed artifact reproducibility
        run: git diff --exit-code -- dist
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Exercise Linux native credential storage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c 'printf "%s" "isolated-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; node scripts/native-smoke.mjs'
      - name: Exercise native credential storage
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs
